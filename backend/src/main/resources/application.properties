spring.datasource.url=jdbc:mysql://localhost:3306/enterprise_fabric?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_database_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.cache.type=redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000
spring.redis.lettuce.pool.max-wait=2000

# TrueFoundry Settings
truefoundry.gateway.url=https://gateway.truefoundry.ai/v1/chat/completions
truefoundry.api.key=your_api_key
